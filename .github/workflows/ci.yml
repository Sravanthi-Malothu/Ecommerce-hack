name: PromoAlign CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build, Lint & Automated Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Frontend Dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: 📦 Install Backend Dependencies
        run: |
          cd backend
          npm ci || npm install

      - name: 🔍 Run Frontend Linter (Oxlint)
        run: |
          cd frontend
          npm run lint

      - name: 🧪 Run Backend Unit Test Suites
        run: |
          cd backend
          node src/test/engineTest.js
          node src/test/pipelineTest.js
          node src/test/backtestTest.js
          node src/test/resilienceTest.js
          node src/test/counterfactualTest.js

      - name: 🚀 Run Frontend Production Build
        run: |
          cd frontend
          npm run build
